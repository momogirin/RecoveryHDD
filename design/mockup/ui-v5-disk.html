<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecoveryHDD</title>
<!-- 시안 v5: 하드 중심 구조. 실제 기능은 없고 화면만 있다. 숫자 중 Seagate 의 찾음/꺼냄/확인 필요/검사 범위는 실제 기록, 종류별 개수와 다른 하드는 예시. -->
<style>
:root {
  --win: #fbfbfb; --side: #f3f3f3; --card: #ffffff; --line: #e5e5e5; --line2: #d4d4d4;
  --text: #1b1b1b; --sub: #5f5f5f; --faint: #8a8a8a;
  --accent: #0067c0; --accent-ink: #ffffff; --accent-soft: #e6f0fa;
  --ok: #107c10; --ok-soft: #e7f4e7; --warn: #9d5d00; --warn-soft: #fdf3e1; --bad: #c42b1c; --bad-soft: #fde7e9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --win: #272727; --side: #202020; --card: #2f2f2f; --line: #3b3b3b; --line2: #4a4a4a;
    --text: #f2f2f2; --sub: #b4b4b4; --faint: #8c8c8c;
    --accent: #4cc2ff; --accent-ink: #00263d; --accent-soft: #1e3a4d;
    --ok: #6ccb5f; --ok-soft: #223a22; --warn: #fce100; --warn-soft: #43391a; --bad: #ff99a4; --bad-soft: #442726; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --win: #272727; --side: #202020; --card: #2f2f2f; --line: #3b3b3b; --line2: #4a4a4a;
  --text: #f2f2f2; --sub: #b4b4b4; --faint: #8c8c8c;
  --accent: #4cc2ff; --accent-ink: #00263d; --accent-soft: #1e3a4d;
  --ok: #6ccb5f; --ok-soft: #223a22; --warn: #fce100; --warn-soft: #43391a; --bad: #ff99a4; --bad-soft: #442726; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--win); color: var(--text); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; min-width: 960px; min-height: 620px; overflow: hidden; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }

/* 틀: 왼쪽 하드 목록 | 오른쪽 하드 화면, 맨 아래 상태 바 */
.shell { display: grid; grid-template-columns: 272px 1fr; grid-template-rows: 1fr 36px; height: 100vh; }
.side { grid-row: 1; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side .head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 18px; font-size: 13px; color: var(--sub); flex: none; }
.side .head b { color: var(--text); font-size: 14px; }
.iconbtn { width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; color: var(--sub); cursor: pointer; display: grid; place-items: center; font-size: 15px; }
.iconbtn:hover { background: var(--line); }
.disks { flex: 1; overflow-y: auto; padding: 0 10px; min-height: 0; }
.dk { display: flex; gap: 12px; align-items: center; height: 68px; padding: 0 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; margin-bottom: 6px; }
.dk:hover { background: var(--line); }
.dk.on { background: var(--card); border-color: var(--line2); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.dk .ic { width: 38px; height: 38px; border-radius: 9px; flex: none; background: linear-gradient(160deg, #3a4a63, #1d2636); display: grid; place-items: center; color: #fff; font-size: 17px; position: relative; }
.dk .ic i { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--side); background: var(--faint); }
.dk .ic i.ok { background: var(--ok); } .dk .ic i.run { background: var(--accent); } .dk .ic i.warn { background: var(--warn); }
.dk.off .ic { background: linear-gradient(160deg, #8a8a8a, #5b5b5b); }
.dk .tx { flex: 1; min-width: 0; }
.dk .n { font-weight: 600; font-size: 14px; height: 21px; line-height: 21px; }
.dk .s { font-size: 12.5px; color: var(--sub); height: 19px; line-height: 19px; }
.dk.off .n, .dk.off .s { color: var(--faint); }
.grp { flex: none; padding: 8px 10px; }
.grp.sys { padding-top: 0; padding-bottom: 12px; }
.nv { width: 100%; height: 38px; border: 0; background: transparent; color: var(--text); border-radius: 8px; text-align: left; padding: 0 12px; font: inherit; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; position: relative; }
.nv:hover { background: var(--line); }
.nv.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.nv.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
.nv .gi { width: 20px; text-align: center; color: var(--sub); flex: none; }
.sep { flex: none; height: 1px; background: var(--line); margin: 0 16px; }
.side .head { height: 40px; }
.side .head b { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: .2px; }
.dk.on { position: relative; }
.dk.on::before { content: ""; position: absolute; left: -1px; top: 18px; bottom: 18px; width: 3px; border-radius: 3px; background: var(--accent); }
.list.home-dev .row { height: 64px; }
.home-dev .ic2 { width: 34px; height: 34px; border-radius: 8px; flex: none; background: linear-gradient(160deg, #3a4a63, #1d2636); display: grid; place-items: center; color: #fff; font-size: 15px; }
.home-dev .row.off .ic2 { background: linear-gradient(160deg, #8a8a8a, #5b5b5b); }
.home-dev .nm { width: 230px; flex: none; } .home-dev .nm b { display: block; height: 22px; } .home-dev .nm span { display: block; font-size: 12.5px; color: var(--sub); height: 18px; }
.home-dev .row.off .nm b { color: var(--faint); }
.list.pref .row { height: 60px; } .pref .row .w b { display: block; font-weight: 600; height: 22px; } .pref .row .w span { display: block; font-size: 12.5px; color: var(--sub); height: 18px; }
.sw { width: 40px; height: 22px; border-radius: 11px; background: var(--line2); position: relative; flex: none; cursor: pointer; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.sw.on { background: var(--accent); } .sw.on::after { left: 21px; }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; flex: none; }
.seg span { height: 30px; line-height: 30px; padding: 0 12px; font-size: 13px; cursor: pointer; }
.seg span.on { background: var(--accent); color: var(--accent-ink); }
.helpcard { padding: 6px 20px; } .helpcard li { margin: 10px 0; color: var(--text); } .helpcard ul { margin: 0; padding-left: 18px; }

.main { grid-row: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { flex: none; padding: 18px 32px 0; border-bottom: 1px solid var(--line); background: var(--win); }
.top .t1 { display: flex; align-items: center; gap: 12px; height: 34px; }
.top h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
.top .meta { font-size: 13px; color: var(--sub); height: 20px; line-height: 20px; }
.tabs { display: flex; gap: 4px; margin-top: 10px; height: 42px; }
.tab { height: 42px; padding: 0 14px; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--sub); cursor: pointer; position: relative; display: flex; align-items: center; gap: 6px; flex: none; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); font-weight: 600; }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px; background: var(--accent); }
.tab .b { min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11.5px; line-height: 18px; text-align: center; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.tab:disabled { color: var(--faint); cursor: default; }
.body { flex: 1; overflow-y: auto; padding: 22px 32px 28px; min-height: 0; }

.status { grid-column: 1 / 3; grid-row: 2; border-top: 1px solid var(--line); background: var(--side); display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 13px; color: var(--sub); }
.status .who { width: 200px; flex: none; }
.status .what { flex: 1; }
.status .pb { width: 220px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.status .pb i { display: block; height: 100%; background: var(--accent); }
.status .pc { width: 150px; text-align: right; flex: none; }
.status.idle .pb { visibility: hidden; }

/* 공통 부품 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.btn { height: 34px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line2); background: var(--card); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.w { width: 132px; }
.chip { display: inline-block; width: 92px; height: 24px; line-height: 24px; text-align: center; border-radius: 99px; font-size: 12.5px; flex: none; background: var(--line); color: var(--sub); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.run { background: var(--accent-soft); color: var(--accent); }
.sec { font-size: 13px; color: var(--sub); margin: 22px 0 8px; font-weight: 600; }
.sec:first-child { margin-top: 0; }
.hint { font-size: 13px; color: var(--sub); }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { height: 92px; padding: 14px 18px; }
.tile .v { font-size: 26px; font-weight: 600; height: 36px; line-height: 36px; }
.tile .l { font-size: 13px; color: var(--sub); height: 20px; }
.tile.warn .v { color: var(--warn); }

.next { display: flex; align-items: center; gap: 16px; height: 76px; padding: 0 20px; background: var(--accent-soft); border-color: transparent; }
.next .tx { flex: 1; min-width: 0; } .next .a { font-weight: 600; height: 22px; } .next .b { font-size: 13px; color: var(--sub); height: 20px; }

.list .row { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 14px; }
.list .row:first-child { border-top: 0; }
.list .row .d { width: 120px; color: var(--sub); flex: none; }
.list .row .w { flex: 1; min-width: 0; }

.op { display: flex; align-items: center; gap: 18px; height: 112px; padding: 0 20px; margin-bottom: 10px; }
.op .tx { flex: 1; min-width: 0; }
.op .a { display: flex; align-items: center; gap: 10px; height: 26px; font-weight: 600; font-size: 15px; }
.op .b { font-size: 13px; color: var(--sub); height: 20px; margin-top: 2px; }
.op .pbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 10px; }
.op .pbar i { display: block; height: 100%; background: var(--accent); }
.op .c { font-size: 12.5px; color: var(--sub); height: 18px; margin-top: 4px; }
.op .act { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; width: 140px; flex: none; }
.op .act .hint { width: 140px; height: 18px; line-height: 18px; text-align: right; font-size: 12px; }

.kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kind { height: 74px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
.kind .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; font-size: 12px; color: var(--accent-ink); }
.kind.on { border-color: var(--accent); } .kind.on .box { background: var(--accent); border-color: var(--accent); }
.kind .tx { flex: 1; min-width: 0; } .kind .n { font-weight: 600; height: 22px; } .kind .s { font-size: 12.5px; color: var(--sub); height: 18px; }
.dest { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; }
.dest .p { flex: 1; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.sum { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 18px; margin-top: 16px; }
.sum .tx { flex: 1; min-width: 0; }

.res { display: flex; align-items: center; gap: 16px; height: 80px; padding: 0 20px; }
.res .big { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--warn-soft); color: var(--warn); flex: none; }
.res .tx { flex: 1; min-width: 0; } .res .a { font-weight: 600; height: 24px; } .res .b { font-size: 13px; color: var(--sub); height: 20px; }
.thumbs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.thumbs div { aspect-ratio: 4/3; border-radius: 6px; background: linear-gradient(135deg, var(--line), var(--line2)); }
.btnrow { display: flex; gap: 8px; margin-top: 14px; }

.fmt { padding: 6px 18px 10px; }
.fmt li { list-style: none; display: flex; align-items: center; gap: 10px; height: 32px; font-size: 14px; }
.fmt ul { margin: 0; padding: 0; }
.fmt .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line2); }
.fmt .ok .dot { background: var(--ok); } .fmt .warn .dot { background: var(--warn); } .fmt .bad .dot { background: var(--bad); }
.fmt .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fmthead { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.fmthead .tx { flex: 1; min-width: 0; }

.empty { height: 220px; display: grid; place-items: center; text-align: center; }
.empty p { color: var(--sub); margin: 6px 0 14px; }

/* 시안 전용 조작판 */
.demo { position: fixed; right: 16px; bottom: 48px; background: #222; color: #eee; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.demo button { background: #444; color: #fff; border: 0; border-radius: 6px; height: 26px; padding: 0 10px; font: inherit; cursor: pointer; }
.demo button.on { background: #0a84ff; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="grp"><button class="nv" data-v="home"><span class="gi">⌂</span>홈</button></div>
    <div class="sep"></div>
    <div class="head"><b>장치 목록</b><button class="iconbtn" title="목록 새로 고침">⟳</button></div>
    <div class="disks" id="disks"></div>
    <div class="sep"></div>
    <div class="head"><b>시스템</b></div>
    <div class="grp sys"><button class="nv" data-v="prefs"><span class="gi">⚙</span>설정</button><button class="nv" data-v="help"><span class="gi">?</span>도움말</button></div>
  </aside>
  <section class="main">
    <div class="top">
      <div class="t1"><h1 class="ell" id="dname"></h1><span class="chip" id="dchip"></span></div>
      <div class="meta ell" id="dmeta"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="body" id="body"></div>
  </section>
  <footer class="status idle" id="status">
    <span class="who ell" id="st-who"></span><span class="what ell" id="st-what"></span>
    <span class="pb"><i id="st-pb" style="width:0%"></i></span><span class="pc num ell" id="st-pc"></span>
  </footer>
</div>
<div class="demo">시안 전용 · 상태 바꾸기 <button id="d-idle" class="on">대기</button><button id="d-run">끝부분 검사 중</button><button id="d-theme">다크</button></div>

<script>
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); }
  kids.flat().forEach(k => k != null && e.append(k)); return e;
}
const D = [
  { id: 'sg', name: 'Seagate Expansion 5TB', size: '5.00 TB', conn: true, rec: true, found: '17,241', got: '16,078', need: 6, scanned: '앞쪽 372 GB / 5.00 TB', last: '2026-11-24' },
  { id: 'usb', name: 'USB 디스크', size: '64 GB', conn: true, rec: false },
  { id: 'wd', name: 'WD Elements 2TB (예시)', size: '2.00 TB', conn: false, rec: true, found: '3,410', got: '3,402', need: 0, scanned: '전체 2.00 TB', last: '2026-10-02' },
];
const S = { view: 'home', disk: 'sg', tab: 'over', run: false, pct: 52 };
const TABS = [['over', '개요'], ['scan', '검사'], ['ext', '추출'], ['res', '결과'], ['fmt', '포맷 점검']];

function diskLine(d) {
  if (S.run && d.id === 'sg') return '끝부분 검사 중 · ' + S.pct + '%';
  if (!d.rec) return d.conn ? d.size + ' · 검사 안 함' : '';
  return (d.conn ? '' : '연결 안 됨 · ') + d.got + '개 꺼냄' + (d.need ? ' · 확인 ' + d.need : '');
}
function dot(d) { return S.run && d.id === 'sg' ? 'run' : !d.rec ? '' : d.need ? 'warn' : 'ok'; }
function renderDisks() {
  const box = $('#disks'); box.replaceChildren();
  document.querySelectorAll('.nv').forEach(n => n.classList.toggle('on', n.dataset.v === S.view));
  D.forEach(d => box.append(h('div', { class: 'dk' + (S.view === 'disk' && d.id === S.disk ? ' on' : '') + (d.conn ? '' : ' off'), onclick: () => openDisk(d.id) },
    h('div', { class: 'ic' }, '🖴', h('i', { class: dot(d) })),
    h('div', { class: 'tx' }, h('div', { class: 'n ell', title: d.name }, d.name), h('div', { class: 's ell', title: diskLine(d) }, diskLine(d))))));
}
const cur = () => D.find(d => d.id === S.disk);
function avail(t) { const d = cur(); if (t === 'over' || t === 'scan') return true; return d.rec; }

function openDisk(id, tab) { S.view = 'disk'; S.disk = id; S.tab = tab || (avail(S.tab) ? S.tab : 'over'); if (!avail(S.tab)) S.tab = 'over'; render(); }
const PAGE = {
  home: ['홈', '연결된 장치 2개 · 기록이 있는 장치 2개'],
  prefs: ['설정', '기록 폴더, 목록에 보일 장치, 화면 테마'],
  help: ['도움말', 'RecoveryHDD · 원본 장치는 읽기만 합니다'],
};
function renderStatus(d) {
  const st = $('#status'); st.classList.toggle('idle', !S.run);
  $('#st-who').textContent = S.run ? 'Seagate Expansion 5TB' : S.view === 'disk' ? d.name : '';
  $('#st-what').textContent = S.run ? '끝부분 촘촘 검사 중 · 원본은 읽기만 해요' : '대기 중';
  $('#st-pb').style.width = S.pct + '%';
  $('#st-pc').textContent = S.run ? S.pct + '% · 남은 시간 9분' : '';
}
function render(tick) {
  renderDisks();
  const d = cur();
  if (S.view !== 'disk') {
    const p = PAGE[S.view];
    $('#dname').textContent = p[0]; const c = $('#dchip'); c.className = 'chip'; c.style.visibility = 'hidden';
    $('#dmeta').textContent = S.view === 'home' && S.run ? '작업 1개 진행 중 · ' + p[1] : p[1];
    $('#tabs').replaceChildren();  // 탭 줄 자리는 그대로 둔다(높이 고정)
    const body = $('#body'), y = body.scrollTop; body.replaceChildren(PAGES[S.view]()); body.scrollTop = tick ? y : 0;
    return renderStatus(d);
  }
  $('#dchip').style.visibility = '';
  $('#dname').textContent = d.name;
  const c = $('#dchip');
  if (S.run && d.id === 'sg') { c.className = 'chip run'; c.textContent = '작업 중'; }
  else if (!d.conn) { c.className = 'chip'; c.textContent = '연결 안 됨'; }
  else if (!d.rec) { c.className = 'chip'; c.textContent = '검사 전'; }
  else { c.className = 'chip ' + (d.need ? 'warn' : 'ok'); c.textContent = d.need ? '확인 필요' : '정상'; }
  $('#dmeta').textContent = d.size + ' · ' + (d.rec ? '검사 범위 ' + d.scanned + ' · 마지막 작업 ' + d.last : d.conn ? '이 하드는 아직 검사하지 않았어요' : '');
  const tabs = $('#tabs'); tabs.replaceChildren();
